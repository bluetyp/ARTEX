name: artex
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: artex
    volumes:
      - ${STATE_ROOT:?required}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  artex:
    image: ${ARTEX_IMAGE:?immutable Registry image required}
    user: "10001:10001"
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://artex:${POSTGRES_PASSWORD}@postgres:5432/artex?sslmode=disable
      ARTEX_CONFIG: /app/config.json
      ARTEX_SKILL_DIR: /app/skills
      HOME: /app/data/home
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${APP_PORT:-18500}:8787"
      - "127.0.0.1:${PROXY_PORT:-18501}:8788"
    volumes:
      - ${STATE_ROOT}/data:/app/data
      - ${STATE_ROOT}/skills:/app/skills
      - ${STATE_ROOT}/jwt.key:/app/jwt.key:ro
      - ${STATE_ROOT}/config.json:/app/config.json
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/api/health >/dev/null && curl -fsS http://127.0.0.1:8787/api/auth/status >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped
    logging: *logging
