server {
    listen 80;
    server_name artex.zheqikejiai.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name artex.zheqikejiai.com;
    ssl_certificate /etc/nginx/ssl/jk.zheqikejiai.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/jk.zheqikejiai.com/privkey.pem;
    client_max_body_size 100m;
    # No JWT query strings in access logs (SSE authenticates with ?token=).
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    # Keep diagnostics private; container health checks use loopback directly.
    location = /api/health { return 404; }
    location / {
        proxy_pass http://127.0.0.1:18500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Content-Type-Options nosniff always;
    }
}
